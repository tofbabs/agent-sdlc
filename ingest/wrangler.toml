name = "agentic-sdlc-ingest"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"

# Custom hostname only: the human picks it and sets it here and in the WAF rule.
workers_dev = false
routes = [
  { pattern = "ingest-agent-sdlc.afani.cloud/*", zone_name = "afani.cloud" },
]

[vars]
# "on" makes /v1/register and /v1/reports answer 503 {"stop":true}.
KILL_SWITCH = "off"

[[d1_databases]]
binding = "DB"
database_name = "agentic-sdlc-ingest"
database_id = "3eb58e02-f66f-4a96-9f41-a30964d91a96"
migrations_dir = "migrations"

[triggers]
# Daily, off-peak; drives the retention sweep.
crons = ["17 3 * * *"]
