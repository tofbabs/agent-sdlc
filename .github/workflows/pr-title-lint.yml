name: PR title lint

# Two guards, both protecting the same thing: that a change which reaches this
# repo also reaches consuming projects.
#
# 1. release-please derives releases from the commit SUBJECT on main, and this
#    repo squash-merges the PR TITLE into that subject. A non-conventional title
#    lands a subject release-please cannot parse, so the merged change gets no
#    version bump, no changelog entry and no tag. reward-fulfillment-app hit
#    exactly this (its PR #66).
#
# 2. A PR that edits shipped plugin content under a type release-please ignores
#    (chore/docs/ci/refactor) produces NO new version. Claude Code resolves a
#    plugin's version from plugin.json and keeps its cached copy when the string
#    has not changed — so the change ships to nobody, silently. That was the
#    original failure mode this repo was built to prevent; under release-please
#    it reappears as "wrong commit type" rather than "forgot to bump".
#
# Make both REQUIRED status checks in branch protection to actually enforce them.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  # Deliberately reports on merge_group too: a required check that never runs on
  # the merge queue is treated as never satisfied and blocks the merge forever.
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Merge-queue no-op (title validated on the pull_request event)
        if: github.event_name == 'merge_group'
        run: echo "merge_group — title already validated on pull_request; reporting pass."

      - name: PR title must be a Conventional Commit
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Exactly the types release-please-config.json lists under
          # changelog-sections. Any other type is silently dropped.
          types: |
            feat
            fix
            docs
            refactor
            revert
            build
            ci
            test
            chore
          requireScope: false

  shipped-content-is-releasable:
    runs-on: ubuntu-latest
    steps:
      - name: Merge-queue no-op
        if: github.event_name == 'merge_group'
        run: echo "merge_group — validated on pull_request; reporting pass."

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - name: Editing plugins/** requires feat or fix
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # release-please's own release PR is the one case where a chore: title
          # MUST be allowed to touch plugins/. Its entire job is to move
          # plugin.json's version, via the extra-files updater in
          # release-please-config.json, and it is always titled
          # `chore(main): release <version>`. Without this exemption the guard
          # fails every release PR and nothing can ever ship — the exact outcome
          # it was written to prevent, arrived at from the other direction.
          #
          # Exempt narrowly, on the branch release-please owns rather than the
          # `autorelease: pending` label, which a human can add to anything: the
          # only plugins/ path it may touch is the manifest it exists to bump. A
          # release branch carrying any other plugin edit still fails, because
          # that content would ship under a version release-please already
          # decided, with no changelog entry describing it.
          if [ "$HEAD_REF" != "${HEAD_REF#release-please--}" ]; then
            SMUGGLED="$(gh pr view "$PR" --json files --jq '.files[].path' \
              | { grep '^plugins/' || true; } \
              | { grep -vE '^plugins/[^/]+/\.claude-plugin/plugin\.json$' || true; })"
            if [ -n "$SMUGGLED" ]; then
              echo "::error::Release PR '$TITLE' touches plugin content beyond the version manifest. Those edits would ship under a version release-please has already decided, with nothing in the changelog describing them. Move them to their own feat: or fix: PR."
              printf '%s\n' "$SMUGGLED" | sed 's/^/  unexpected: /'
              exit 1
            fi
            echo "release-please release PR on '$HEAD_REF' — manifest bump only. OK."
            exit 0
          fi

          # Only `feat` and `fix` reliably produce a version bump. Everything
          # else may be shown in the changelog without cutting a release.
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix)(\([^)]*\))?!?:'; then
            echo "Title is '$TITLE' — releasable. OK."
            exit 0
          fi

          # A `!` or a BREAKING CHANGE footer always releases, whatever the type.
          if printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            echo "Title marks a breaking change — releasable. OK."
            exit 0
          fi

          CHANGED="$(gh pr view "$PR" --json files --jq '.files[].path')"
          if printf '%s\n' "$CHANGED" | grep -q '^plugins/'; then
            echo "::error::This PR edits shipped plugin content under plugins/, but its title is '$TITLE'. Only feat: and fix: cut a new version. Merged as-is, plugin.json's version string would not move, Claude Code would keep every consuming project's cached copy, and this change would reach nobody. Retitle it feat: or fix:, or move the plugins/ edit to its own PR."
            printf '%s\n' "$CHANGED" | sed 's/^/  changed: /'
            exit 1
          fi

          echo "No plugins/ content touched — '$TITLE' is fine."
