name: ingest-deploy

# The Worker bundles the shared schema and vocabulary, so a change to either
# redeploys it: client and edge validators move in lockstep.
on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - 'plugins/agentic-sdlc/scripts/run-report-schema.mjs'
      - 'plugins/agentic-sdlc/scripts/run-report-categories.mjs'
  # Lets the first deploy after provisioning run without an ingest/ change.
  workflow_dispatch:

concurrency: ingest-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest tests
        run: |
          ./scripts/ingest.test.sh
          ./scripts/ingest-limits.test.sh

      # Until the README's one-time setup is done, a deploy can only fail, and a
      # red main would hide real breakage. Skipping here means provisioning
      # needs no workflow change: the next push simply deploys.
      - name: Check Cloudflare is provisioned
        id: provisioned
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipping deploy: repository secret CLOUDFLARE_API_TOKEN is not set (see ingest/README.md, one-time setup)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_' ingest/wrangler.toml; then
            echo "::notice::Skipping deploy: ingest/wrangler.toml still has REPLACE_WITH_ placeholders (see ingest/README.md, one-time setup)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        if: steps.provisioned.outputs.ready == 'true'
        working-directory: ingest
        run: npm install

      - name: Apply D1 migrations
        if: steps.provisioned.outputs.ready == 'true'
        working-directory: ingest
        run: npx wrangler d1 migrations apply agentic-sdlc-ingest --remote

      - name: Deploy
        if: steps.provisioned.outputs.ready == 'true'
        working-directory: ingest
        run: npx wrangler deploy
