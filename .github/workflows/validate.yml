name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Structural validation of marketplace.json, plugin.json, and every
      # agent/command frontmatter.
      - name: Validate plugin
        run: claude plugin validate .

      - name: JSON is parseable
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/agentic-sdlc/.claude-plugin/plugin.json \
                   release-please-config.json \
                   .release-please-manifest.json \
                   .claude/settings.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      # plugin.json is what Claude Code reads; a version in marketplace.json is
      # silently ignored, so a stale manifest would be impossible to spot.
      - name: Version is declared in exactly one place
        run: |
          if grep -q '"version"' .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json declares a version — plugin.json always wins, silently. Remove it."
            exit 1
          fi

      # release-please writes version.txt (its `simple` strategy) and, via
      # extra-files, plugin.json. If the extra-files entry is ever broken or
      # renamed, release-please still tags and still bumps version.txt while
      # plugin.json stays behind — and a plugin whose version string did not move
      # reaches no existing install. That is the original footgun wearing a new
      # hat, so it gets its own check rather than being assumed away.
      - name: version.txt, the manifest and plugin.json agree
        run: |
          PLUGIN=$(python3 -c "import json;print(json.load(open('plugins/agentic-sdlc/.claude-plugin/plugin.json'))['version'])")
          TXT=$(tr -d '[:space:]' < version.txt)
          MANIFEST=$(python3 -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          echo "plugin.json=$PLUGIN  version.txt=$TXT  manifest=$MANIFEST"
          if [ "$PLUGIN" != "$TXT" ] || [ "$PLUGIN" != "$MANIFEST" ]; then
            echo "::error::Version files disagree. plugin.json is the authority Claude Code reads; version.txt and .release-please-manifest.json are release-please bookkeeping. All three are machine-written — do not hand-edit them. If they have drifted, check the extra-files entry in release-please-config.json."
            exit 1
          fi

      # The repo builds itself with its own plugin, pinned in .claude/settings.json
      # to the latest tag; release-please moves that ref via a generic extra-file.
      # If that entry breaks, the repo silently builds with an old release.
      - name: Self-pin tracks the latest release
        run: |
          PLUGIN=$(python3 -c "import json;print(json.load(open('plugins/agentic-sdlc/.claude-plugin/plugin.json'))['version'])")
          REF=$(python3 -c "import json;print(json.load(open('.claude/settings.json'))['extraKnownMarketplaces']['sanimara']['source']['ref'])")
          echo "plugin.json=$PLUGIN  .claude/settings.json ref=$REF"
          if [ "$REF" != "v$PLUGIN" ]; then
            echo "::error::.claude/settings.json pins this repo's own plugin at $REF, but plugin.json is $PLUGIN. release-please moves the ref via the generic extra-file in release-please-config.json — do not hand-edit it; fix the extra-file."
            exit 1
          fi

      # pair-log.mjs is the enforcement behind the PAIR loop's two carryover
      # limits — the 10-line turn entry and the driver never receiving the brief.
      # Both were prose in build.md before and drifted in every measured story;
      # a regression here silently restores a 3.6x token cost on every PAIR
      # story, which no other check would notice.
      - name: pair-log invariants
        run: ./scripts/pair-log.test.sh

      # pair-run.mjs drives the PAIR loop headless so the orchestrator does not
      # spend a turn per alternation. Its stop conditions (complete, blocked, cap,
      # failed turn, no-progress turn) are what keep it from spawning forever.
      - name: pair-run loop invariants
        run: ./scripts/pair-run.test.sh

      # meter.mjs is the instrument every cost claim in the programme rests on.
      # Its totals must reproduce byte-exactly, and a transcript with an internal
      # field missing must degrade to layer A rather than silently report zeros —
      # silent zeros would make every downstream number a lie. That degradation
      # case is this suite's analogue of the pair-log cap test.
      - name: meter invariants
        run: ./scripts/meter.test.sh

      # The consent answer gates every export; the wiring check keeps the
      # protocol reachable from plan and build.
      - name: consent store and wiring
        run: ./scripts/consent.test.sh

      # run-report.mjs builds the report that is exported later, so it is
      # code-free by schema: no field accepts an unbounded string, cost is the
      # meter record verbatim, and a missing input is null + named, never zero.
      - name: run-report invariants
        run: ./scripts/run-report.test.sh

      # The report schema is shared with the ingest Worker, so it must stay
      # free of node: imports and be reused rather than copied.
      - name: run-report schema invariants
        run: ./scripts/run-report-schema.test.sh

      - name: ingest handler tests
        run: |
          ./scripts/ingest.test.sh
          ./scripts/ingest-limits.test.sh

      # run-report.sh is the UserPromptSubmit/SessionEnd hook wrapping
      # run-report.mjs. UserPromptSubmit's stdout is injected into the model's
      # context, so a leak there is not cosmetic; SessionEnd shares a 1.5s budget
      # with every other SessionEnd hook, so its report build must be spawned
      # detached, never awaited. Run under /bin/bash explicitly — the macOS 3.2
      # bash is the one whose quirks (no arrays, `set -u` on `${arr[@]}`) matter.
      - name: run-report hook invariants
        run: /bin/bash ./scripts/run-report-hook.test.sh

      # plan-artifacts.mjs claims backlog IDs across every worktree and branch,
      # and carries a plan onto its build branch. Without it, parallel sessions
      # reuse FAST-<n> and plans never ship with the code they describe.
      - name: plan-artifacts invariants
        run: ./scripts/plan-artifacts.test.sh

      # The repo ID rides on every uploaded report, so a leak of the repo name,
      # remote, user or host through it is the failure this suite exists to catch.
      - name: repo-id anonymity
        run: ./scripts/repo-id.test.sh

      # Reports leave the machine through this client, so its queue, backoff and
      # kill switch are tested against a local stub server only.
      - name: export client
        run: ./scripts/export.test.sh

      # A black-holed or failing endpoint must never hold a session open, and
      # the kill switch must stop sends until it clears.
      - name: export client resilience
        run: ./scripts/export-resilience.test.sh

      # The agent boot path is a cost surface, not a style surface: a byte added
      # to coder.md is paid ~40 times on a PAIR story, so this file's growth is a
      # cost regression. The budget is ratchet-only — a file over its cap fails,
      # and a cap raised above origin/main fails. reference/*.md is exempt by
      # design (on-demand, never in the boot path). Fetch main so the ratchet can
      # compare caps against it.
      - name: size budget (ratchet-only)
        run: |
          git fetch --no-tags --depth=1 origin main || true
          node scripts/size-budget.mjs

      # The tag is what consuming projects pin, so it must match what Claude Code
      # will report as the installed version.
      - name: Tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PLUGIN=$(python3 -c "import json;print(json.load(open('plugins/agentic-sdlc/.claude-plugin/plugin.json'))['version'])")
          [ "$TAG" = "$PLUGIN" ] || { echo "::error::tag v$TAG != plugin.json $PLUGIN"; exit 1; }
