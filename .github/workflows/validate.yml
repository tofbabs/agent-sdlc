name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Structural validation of marketplace.json, plugin.json, and every
      # agent/command frontmatter.
      - name: Validate plugin
        run: claude plugin validate .

      - name: JSON is parseable
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/agentic-sdlc/.claude-plugin/plugin.json \
                   release-please-config.json \
                   .release-please-manifest.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      # plugin.json is what Claude Code reads; a version in marketplace.json is
      # silently ignored, so a stale manifest would be impossible to spot.
      - name: Version is declared in exactly one place
        run: |
          if grep -q '"version"' .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json declares a version — plugin.json always wins, silently. Remove it."
            exit 1
          fi

      # release-please writes version.txt (its `simple` strategy) and, via
      # extra-files, plugin.json. If the extra-files entry is ever broken or
      # renamed, release-please still tags and still bumps version.txt while
      # plugin.json stays behind — and a plugin whose version string did not move
      # reaches no existing install. That is the original footgun wearing a new
      # hat, so it gets its own check rather than being assumed away.
      - name: version.txt, the manifest and plugin.json agree
        run: |
          PLUGIN=$(python3 -c "import json;print(json.load(open('plugins/agentic-sdlc/.claude-plugin/plugin.json'))['version'])")
          TXT=$(tr -d '[:space:]' < version.txt)
          MANIFEST=$(python3 -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          echo "plugin.json=$PLUGIN  version.txt=$TXT  manifest=$MANIFEST"
          if [ "$PLUGIN" != "$TXT" ] || [ "$PLUGIN" != "$MANIFEST" ]; then
            echo "::error::Version files disagree. plugin.json is the authority Claude Code reads; version.txt and .release-please-manifest.json are release-please bookkeeping. All three are machine-written — do not hand-edit them. If they have drifted, check the extra-files entry in release-please-config.json."
            exit 1
          fi

      # pair-log.mjs is the enforcement behind the PAIR loop's two carryover
      # limits — the 10-line turn entry and the driver never receiving the brief.
      # Both were prose in build.md before and drifted in every measured story;
      # a regression here silently restores a 3.6x token cost on every PAIR
      # story, which no other check would notice.
      - name: pair-log invariants
        run: ./scripts/pair-log.test.sh

      # The tag is what consuming projects pin, so it must match what Claude Code
      # will report as the installed version.
      - name: Tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PLUGIN=$(python3 -c "import json;print(json.load(open('plugins/agentic-sdlc/.claude-plugin/plugin.json'))['version'])")
          [ "$TAG" = "$PLUGIN" ] || { echo "::error::tag v$TAG != plugin.json $PLUGIN"; exit 1; }
